# Docker Compose Override for Local Development
# This file is automatically merged with docker-compose.yml when running docker-compose
# It provides development-friendly defaults and additional services for local development

version: '3.8'

services:
  # Override app service for development
  app:
    environment:
      # Development profile
      SPRING_PROFILES_ACTIVE: dev
      
      # Enable detailed logging
      LOG_LEVEL_APP: DEBUG
      LOG_LEVEL_SECURITY: DEBUG
      HIBERNATE_SHOW_SQL: "true"
      
      # Auto-update schema in development
      HIBERNATE_DDL_AUTO: update
      
      # Show detailed health information
      MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS: always
      
      # Development CORS (allow localhost)
      CORS_ALLOWED_ORIGINS: http://localhost:4200,http://localhost:3000
      
      # Development JWT secret (DO NOT use in production)
      JWT_SECRET: dev-secret-key-for-local-development-only-change-in-production
      
    # Mount source code for hot reload (if using Spring Boot DevTools)
    # volumes:
    #   - ./build/classes/java/main:/app/classes
    
    # Enable port for remote debugging
    ports:
      - "2580:2580"
      - "5005:5005"  # Remote debugging port
    
    # Add JVM debug options
    command: >
      java
      -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005
      -XX:+UseContainerSupport
      -XX:MaxRAMPercentage=75.0
      -Djava.security.egd=file:/dev/./urandom
      -jar
      app.jar
  
  # Add pgAdmin for database management (optional)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin_is
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    networks:
      - app-network
    depends_on:
      - postgres
    restart: unless-stopped

  # Add Redis Commander for Redis management (optional)
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: redis_commander_is
    environment:
      REDIS_HOSTS: local:redis:6379
    ports:
      - "8081:8081"
    networks:
      - app-network
    depends_on:
      - redis
    restart: unless-stopped
