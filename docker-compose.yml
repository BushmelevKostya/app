volumes:
  postgres_data:
  keycloak-db-volume: {}
  redis_data:
  minio_data: {}

version: '3.8'

networks:
  app-network:
    driver: bridge

services:
  postgres:
    image: postgres:16
    container_name: postgres_is
    environment:
      POSTGRES_USER: is
      POSTGRES_PASSWORD: is
      POSTGRES_DB: is
    ports:
      - '5434:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U is"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:latest
    container_name: redis_is
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    networks:
      - app-network
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: minio_is
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio_data:/data
    networks:
      - app-network
    command: server /data --console-address ":9001"
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: app_container
    environment:
      # Database configuration
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/is
      SPRING_DATASOURCE_USERNAME: is
      SPRING_DATASOURCE_PASSWORD: is
      
      # Redis configuration
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      
      # MinIO configuration
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET_NAME: movies
      
      # JWT configuration (should be externalized in production)
      JWT_SECRET: your-secret-key-change-in-production-at-least-256-bits-long
      JWT_EXPIRATION: 86400000
      
      # CORS configuration
      CORS_ALLOWED_ORIGINS: http://localhost:4200
      
      # Spring profiles
      SPRING_PROFILES_ACTIVE: prod
      
      # JVM options are set in Dockerfile
    ports:
      - '2580:2580'
    networks:
      - app-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:2580/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped