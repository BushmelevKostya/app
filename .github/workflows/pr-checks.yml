name: Pull Request Checks

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  pr-validation:
    name: Validate PR
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Check PR title format
      run: |
        PR_TITLE="${{ github.event.pull_request.title }}"
        if ! echo "$PR_TITLE" | grep -qE '^(feat|fix|docs|style|refactor|test|chore|perf|ci|build|revert)(\(.+\))?: .+'; then
          echo "❌ PR title does not follow conventional commits format"
          echo "Expected format: type(scope): description"
          echo "Types: feat, fix, docs, style, refactor, test, chore, perf, ci, build, revert"
          exit 1
        fi
        echo "✅ PR title follows conventional commits format"
        
    - name: Check for merge conflicts
      run: |
        if git grep -q '<<<<<<<' -- '*.java' '*.ts' '*.yml' '*.md'; then
          echo "❌ Merge conflict markers found in files"
          exit 1
        fi
        echo "✅ No merge conflicts found"

  lint-java:
    name: Lint Java Code
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
        
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      
    - name: Run SpotBugs
      run: ./gradlew spotbugsMain spotbugsTest
      continue-on-error: true
      
    - name: Comment PR with SpotBugs results
      if: always()
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const spotbugsReport = 'build/reports/spotbugs/main.html';
          
          if (fs.existsSync(spotbugsReport)) {
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '## 🔍 SpotBugs Analysis\n\nSpotBugs analysis completed. Please review the report in the artifacts.'
            });
          }

  lint-frontend:
    name: Lint Frontend Code
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
        
    - name: Install dependencies
      working-directory: frontend
      run: npm ci
      
    - name: Run ESLint
      working-directory: frontend
      run: npm run lint || true
      continue-on-error: true

  size-check:
    name: Check Build Size
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
        
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      
    - name: Build JAR
      run: ./gradlew bootJar -x test
      
    - name: Check JAR size
      run: |
        JAR_SIZE=$(stat -f%z build/libs/*.jar 2>/dev/null || stat -c%s build/libs/*.jar)
        JAR_SIZE_MB=$((JAR_SIZE / 1024 / 1024))
        echo "JAR size: ${JAR_SIZE_MB}MB"
        
        if [ $JAR_SIZE_MB -gt 200 ]; then
          echo "⚠️ Warning: JAR file is larger than 200MB"
        else
          echo "✅ JAR size is acceptable"
        fi
