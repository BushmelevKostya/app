name: CI/CD

on:
  push:
    branches: [ main, develop, refactoring, refactoring-step-* ]
  pull_request:
    branches: [ main, develop, refactoring ]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: is
          POSTGRES_PASSWORD: is
          POSTGRES_DB: is_test
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
          
      redis:
        image: redis:latest
        ports:
          - 6379:6379
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Setup JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
        
    - name: Build & Test
      run: |
        chmod +x gradlew
        ./gradlew clean build test jacocoTestReport
      env:
        SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/is_test
        SPRING_DATASOURCE_USERNAME: is
        SPRING_DATASOURCE_PASSWORD: is
        SPRING_REDIS_HOST: localhost
        SPRING_REDIS_PORT: 6379
        
    - name: Upload Coverage
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: build/reports/jacoco/test/html
        retention-days: 7
